name: Build Wasla Android

on:
  workflow_dispatch:
  push:
    paths:
      - "artifacts/wasla-app/**"
      - "lib/api-client-react/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-wasla-android.yml"

permissions:
  contents: read

jobs:
  android:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/wasla-app
    env:
      # Add EXPO_PUBLIC_DOMAIN as a Repository variable in
      # GitHub > Settings > Secrets and variables > Actions > Variables.
      EXPO_PUBLIC_DOMAIN: ${{ vars.EXPO_PUBLIC_DOMAIN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate public API domain
        run: |
          if [ -z "$EXPO_PUBLIC_DOMAIN" ]; then
            echo "Missing the EXPO_PUBLIC_DOMAIN repository variable."
            echo "Set it to the public production domain that serves /api."
            exit 1
          fi

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install workspace dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install --non-interactive

      - name: Build release APK and App Bundle
        working-directory: artifacts/wasla-app/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasla-android
          if-no-files-found: error
          path: |
            artifacts/wasla-app/android/app/build/outputs/apk/release/app-release.apk
            artifacts/wasla-app/android/app/build/outputs/bundle/release/app-release.aab
